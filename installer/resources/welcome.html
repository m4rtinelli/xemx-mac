<h2>XEMX</h2>
<p>A plug-in that plays Korg Electribe EMX-1 patterns from <b>.emx</b> card files, with the original front-panel layout.</p>
<p>This installs the VST3 plug-in, the Audio Unit and the standalone app. Click <b>Customize</b> on the next step to choose only some of them.</p>
