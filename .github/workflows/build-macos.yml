name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      # Optional Apple Developer secrets. Without them the build is ad-hoc signed.
      HAS_SIGNING: ${{ secrets.MACOS_CERTS_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release -- -quiet

      - name: Import Developer ID certificates
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTS_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm certs.p12

      - name: Sign binaries
        env:
          APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
        run: |
          A=build/XEMX_artefacts/Release
          if [ "$HAS_SIGNING" = "true" ]; then ID="$APP_IDENTITY"; OPTS="--options runtime --timestamp"; else ID="-"; OPTS=""; fi
          for b in "$A/VST3/XEMX.vst3" "$A/AU/XEMX.component" "$A/Standalone/XEMX.app"; do
            codesign --force --deep $OPTS --sign "$ID" "$b"
          done
          lipo -info "$A/VST3/XEMX.vst3/Contents/MacOS/XEMX"

      - name: Build installer
        env:
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          VERSION=$(sed -n 's/^project(XEMX VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt) bash installer/build-pkg.sh
          pkgutil --payload-files XEMX-Installer.pkg | grep -E "XEMX\.(vst3|component|app)$" || true

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit XEMX-Installer.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple XEMX-Installer.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: XEMX-Installer
          path: XEMX-Installer.pkg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" XEMX-Installer.pkg --title "XEMX $GITHUB_REF_NAME" --notes-file installer/RELEASE_NOTES.md
